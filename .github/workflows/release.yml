name: release

# Compila aqui, com log público, para o .exe da Release ficar ligado ao commit que o gerou.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Compilacao fora de tag nao vira release, entao fica marcada como dev: assim o
      # binario nao se compara com a ultima release e nao avisa de atualizacao a toa.
      - name: Definir versao
        shell: pwsh
        run: |
          $versao = "${{ github.ref_name }}"
          if (-not $versao.StartsWith('v')) { $versao = 'dev' }
          "VERSAO=$versao" | Out-File -Encoding ascii -Append $env:GITHUB_ENV

      # Executavel sem nome, sem descricao e sem versao e o retrato do que antivirus
      # heuristico marca. Os dados ficam em winres/winres.json e viram recurso do PE.
      - name: Gravar identificacao no executavel
        shell: pwsh
        run: |
          # Recurso de versao so aceita numero: build fora de tag entra como 0.0.0.
          $numero = $env:VERSAO -replace '^v', ''
          if ($numero -notmatch '^\d+(\.\d+)*$') { $numero = '0.0.0' }
          go run github.com/tc-hib/go-winres@v0.3.3 make --arch amd64 --file-version $numero --product-version $numero

      # Sem -s -w de proposito: binario pequeno e sem simbolos parece empacotado, que e
      # justamente o padrao que a heuristica dos antivirus procura. Custa uns 4 MB.
      - name: Compilar
        shell: pwsh
        run: go build -trimpath -ldflags "-X main.version=$env:VERSAO" -o DiscordGoLiveBypass.exe .

      - name: Empacotar e gerar somas
        shell: pwsh
        run: |
          $versao = $env:VERSAO
          $zip = "DiscordGoLiveBypass-$versao-windows-amd64.zip"

          Compress-Archive -Force -DestinationPath $zip -Path DiscordGoLiveBypass.exe, Abrir-Discord.bat, Criar-atalho.ps1, README.md, LICENSE

          $linhas = foreach ($arquivo in @($zip, 'DiscordGoLiveBypass.exe')) {
            '{0}  {1}' -f (Get-FileHash $arquivo -Algorithm SHA256).Hash, $arquivo
          }
          $linhas | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

          "ZIP=$zip" | Out-File -Encoding ascii -Append $env:GITHUB_ENV

      # Em repositório privado a atestação pode não estar disponível, e aí o passo cai sozinho.
      - name: Atestar procedencia
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: DiscordGoLiveBypass.exe

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $arquivos = @("$env:ZIP", "DiscordGoLiveBypass.exe", "SHA256SUMS.txt")

          # Republicar a mesma tag refaz a release do zero, inclusive as notas: manter as
          # antigas deixaria descrição de um build que não existe mais.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes
          }
          gh release create $tag $arquivos --title $tag --generate-notes

      - name: Guardar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: DiscordGoLiveBypass-windows-amd64
          path: |
            DiscordGoLiveBypass.exe
            SHA256SUMS.txt
